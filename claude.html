<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2d2d30 0%, #1e1e1e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 50px;
            background: #252526;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            border-right: 1px solid #3e3e42;
        }

        .sidebar-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 6px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #9d9d9d;
        }

        .sidebar-icon:hover {
            background: #37373d;
            color: #e0e0e0;
        }

        .sidebar-icon.active {
            background: #d97757;
            color: #ffffff;
        }

        .sidebar-icon svg {
            width: 20px;
            height: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .greeting {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            gap: 12px;
            font-size: 32px;
            font-weight: 300;
            letter-spacing: -0.5px;
            color: #e8e8e8;
        }

        .icon-sun {
            width: 28px;
            height: 28px;
            color: #d97757;
        }

        .input-container {
            background: #2d2d30;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid #3e3e42;
        }

        .input-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #a0a0a0;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
            padding: 12px 0;
        }

        textarea::placeholder {
            color: #6d6d6d;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #3e3e42;
        }

        .toolbar-left {
            display: flex;
            gap: 8px;
        }

        .toolbar-btn {
            background: #37373d;
            border: none;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #9d9d9d;
        }

        .toolbar-btn:hover {
            background: #464649;
            color: #e0e0e0;
        }

        .toolbar-btn svg {
            width: 16px;
            height: 16px;
        }

        .toolbar-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .model-selector {
            background: transparent;
            border: none;
            color: #a0a0a0;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .model-selector:hover {
            background: #37373d;
        }

        .submit-btn {
            background: #d97757;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
        }

        .submit-btn:hover {
            background: #e08566;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(217, 119, 87, 0.4);
        }

        .submit-btn svg {
            width: 18px;
            height: 18px;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 14px;
            color: #a0a0a0;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quick-btn:hover {
            background: #37373d;
            border-color: #4e4e52;
            color: #e0e0e0;
            transform: translateY(-2px);
        }

        .quick-btn svg {
            width: 16px;
            height: 16px;
        }

        .user-menu {
            position: fixed;
            bottom: 20px;
            left: 7px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d97757, #e08566);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            font-weight: 600;
        }

        .user-menu:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(217, 119, 87, 0.5);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: fadeIn 0.6s ease;
        }

        .bell-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #9d9d9d;
        }

        .bell-icon:hover {
            background: #37373d;
            color: #e0e0e0;
        }

        .bell-icon svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-icon active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </div>
        <div class="sidebar-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 16v-4M12 8h.01"/>
            </svg>
        </div>
        <div class="sidebar-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M9 3v18"/>
            </svg>
        </div>
        <div class="sidebar-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
        </div>
        <div class="sidebar-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="16 18 22 12 16 6"/>
                <polyline points="8 6 2 12 8 18"/>
            </svg>
        </div>
    </div>

    <div class="bell-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
    </div>

    <div class="user-menu">J</div>

    <div class="container">
        <div class="greeting">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <span>Evening, Jas</span>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea placeholder="How can I help you today?" rows="1"></textarea>
            </div>
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="toolbar-btn" title="Add">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                    <button class="toolbar-btn" title="Attach">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                        </svg>
                    </button>
                    <button class="toolbar-btn" title="History">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </button>
                </div>
                <div class="toolbar-right">
                    <button class="model-selector">
                        Sonnet 4.5
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
                            <path d="M6 9L2 5h8z"/>
                        </svg>
                    </button>
                    <button class="submit-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="quick-actions">
            <button class="quick-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                </svg>
                Code
            </button>
            <button class="quick-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                Write
            </button>
            <button class="quick-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
                Learn
            </button>
            <button class="quick-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 7h-9M14 17H5M16 12h-2M12 12H2M20 12h-2"/>
                    <circle cx="9" cy="7" r="2"/>
                    <circle cx="7" cy="17" r="2"/>
                    <circle cx="15" cy="12" r="2"/>
                </svg>
                Life stuff
            </button>
            <button class="quick-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                </svg>
                From Drive
            </button>
        </div>
    </div>

    <script>
        const textarea = document.querySelector('textarea');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        const submitBtn = document.querySelector('.submit-btn');
        submitBtn.addEventListener('click', function() {
            console.log('Message sent:', textarea.value);
        });
    </script>
</body>
</html>
